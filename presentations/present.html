<script>
  const slides = document.querySelectorAll('.slide');
  let current = 0;
  
  // Initialize the first slide
  if (slides.length > 0) {
    slides[0].classList.add('active');
  }
  
  // Core transition logic: purely instant, zero animations
  function showSlide(index) {
    slides[current].classList.remove('active');
    current = index;
    slides[current].classList.add('active');
  }
  
  // Tap/Click Navigation
  document.body.addEventListener('click', function(e) {
    const width = window.innerWidth;
    // Tapping the right 75% of the screen goes FORWARD. 
    // Tapping the far left 25% of the screen goes BACKWARD.
    if (e.clientX > width * 0.25) { 
      if (current < slides.length - 1) showSlide(current + 1);
    } else { 
      if (current > 0) showSlide(current - 1);
    }
  });
  
  // Laptop/Desktop Keyboard Navigation
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
      if (current < slides.length - 1) showSlide(current + 1);
    } else if (e.key === 'ArrowLeft') {
      if (current > 0) showSlide(current - 1);
    }
  });
</script>
