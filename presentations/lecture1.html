  html, body { 
    margin: 0; 
    padding: 0; 
    background: #000; 
    width: 100%;
    height: 100%; 
    overflow: hidden; /* This absolutely prevents scrolling */
    user-select: none; 
    -webkit-user-select: none; 
  }
  
  #slide-container {
    /* Fixed positioning relative to the actual window */
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Ensure the container is exactly the viewport size */
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  #current-slide { 
    /* Force the image to fit entirely without clipping */
    max-width: 100vw; 
    max-height: 100dvh; 
    object-fit: contain; 
    transform: translateZ(0); 
  }
  
  .nav-btn {
    position: fixed;
    bottom: 20px;
    z-index: 100;
    padding: 15px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    color: white;
    cursor: pointer;
  }
  #back-btn { left: 20px; }

  const imgElement = document.getElementById('current-slide');
  let current = 0;
  
  // The magic trick: Preload the next image into memory so it is instantly ready
  function preloadNext() {
    if (current + 1 < slideUrls.length) {
      const nextImg = new Image();
      nextImg.src = slideUrls[current + 1];
    }
  }

  function showSlide(index) {
    if (index < 0 || index >= slideUrls.length) return;
    current = index;
    // Swap the source to instantly render the slide
    imgElement.src = slideUrls[current];
    // Immediately queue up the next one
    preloadNext();
  }
  
  // Initialize the first slide
  if (slideUrls.length > 0) {
    showSlide(0);
  }
  
  // Tap/Click Navigation
  document.body.addEventListener('click', function(e) {
    const width = window.innerWidth;
    // Tapping the right 75% of the screen goes FORWARD
    if (e.clientX > width * 0.25) { 
      showSlide(current + 1);
    } else { 
      // Tapping the far left 25% goes BACKWARD
      showSlide(current - 1);
    }
  });
  
  // Keyboard Navigation
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
      showSlide(current + 1);
    } else if (e.key === 'ArrowLeft') {
      showSlide(current - 1);
    }
  });
